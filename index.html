<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Laura</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: white;
            overflow: hidden;
        }
        .welcome-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { margin-bottom: 30px; opacity: 0.9; }
        .btn-masuk {
            text-decoration: none;
            background: #ff4b2b;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }
        .btn-masuk:hover {
            transform: scale(1.1);
            background: #ff416c;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>Halo Cantik! ❤️</h1>
        <p>Dashboard Arisan For Laura.<br>Klik tombol di bawah buat mulai rekap ya dan Biar ga susah lagi ya sayang :D </p>
        <a href="dashboard.html" class="btn-masuk">Buka Dashboard</a>
    </div>
</body>
</html>
