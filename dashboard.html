        window.onload = function () {
            // Gunakan v5 agar data sebelumnya terhapus dan pakai logika warna baru ini
            const dataAda = localStorage.getItem('dataArisanLaura_v5');
            if (!dataAda) {
                localStorage.setItem('dataArisanLaura_v5', JSON.stringify(initialData));
            }
            renderTable();
        };

        function renderTable(filter = "") {
            const data = JSON.parse(localStorage.getItem('dataArisanLaura_v5'));
            const tbody = document.querySelector('#tabelArisan tbody');
            tbody.innerHTML = "";

            data.forEach((item, index) => {
                const namaTampil = item.nama || "Tanpa Nama";
                if (namaTampil.toLowerCase().includes(filter.toLowerCase())) {
                    const row = document.createElement('tr');
                    
                    let statusClass = "belum"; // Default warna kuning/abu
                    const s = item.status.toLowerCase();
                    
                    if (s.includes("lunas")) {
                        statusClass = "lunas"; // Warna Hijau
                    } else if (s.includes("-50") || s.includes("‼️")) {
                        statusClass = "telat"; // Warna Merah (Khusus yang minus)
                    }

                    row.innerHTML = `
                        <td>${item.no}</td>
                        <td><strong>${namaTampil}</strong></td>
                        <td>${item.tgl}</td>
                        <td><span class="status ${statusClass}">${item.status}</span></td>
                        <td>Rp ${parseInt(item.denda || 0).toLocaleString()}</td>
                        <td><button class="btn-edit" onclick="updateStatus(${index})">Update</button></td>
                    `;
                    tbody.appendChild(row);
                }
            });
        }

        function updateStatus(originalIndex) {
            let data = JSON.parse(localStorage.getItem('dataArisanLaura_v5'));
            const newStatus = prompt(`Update Status untuk ${data[originalIndex].nama}:`, data[originalIndex].status);
            if (newStatus !== null) {
                data[originalIndex].status = newStatus;
                const newDenda = prompt(`Update Denda:`, data[originalIndex].denda);
                if (newDenda !== null) data[originalIndex].denda = parseInt(newDenda) || 0;
                localStorage.setItem('dataArisanLaura_v5', JSON.stringify(data));
                renderTable(document.getElementById('searchInput').value);
            }
        }

        function cariNama() {
            renderTable(document.getElementById('searchInput').value);
        }
        
        function resetData() {
            if (confirm("Reset ke data awal?")) {
                localStorage.removeItem('dataArisanLaura_v5');
                location.reload();
            }
        }
    </script>
